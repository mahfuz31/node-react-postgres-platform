
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudly-ingress
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - host: node-react.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
