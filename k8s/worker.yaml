apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/mahfuz31/node-react-postgres-platform-backend:assessment-cloudly-devops-latest
          imagePullPolicy: IfNotPresent
          command: ["node", "src/worker.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: REDIS_URL
              value: redis://redis:6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
